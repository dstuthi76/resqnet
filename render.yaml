# Render.com blueprint - free web service running backend + dashboard.
# New > Blueprint > pick this repo. Then add secrets in the Environment tab.
services:
  - type: web
    name: resqnet
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CHAIN_MODE
        value: sim
      - key: ID_SALT
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: NGO_PRIVATE_KEYS
        sync: false
